<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 410" role="img" aria-labelledby="title desc">
<title id="title">HVAC Performance by W&amp;A</title>
<desc id="desc">HVAC Performance by W&amp;A logo with house, snowflake, wrench and airflow.</desc>
<defs>
  <linearGradient id="navyBlue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b315f"/><stop offset=".62" stop-color="#075fae"/><stop offset="1" stop-color="#18bce8"/></linearGradient>
  <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#0879d5"/><stop offset="1" stop-color="#18c6ec"/></linearGradient>
</defs>

<!-- ICON -->
<g transform="translate(18 42)">
  <!-- house -->
  <path d="M25 166 270 25l225 141-18 24L270 70 43 190Z" fill="url(#navyBlue)"/>
  <path d="M66 180v137h285V180" fill="#fff" stroke="#0b315f" stroke-width="7"/>
  <path d="M185 108v205M116 207h137M136 143l100 100M236 143 136 243" stroke="url(#cyan)" stroke-width="13" stroke-linecap="round"/>
  <!-- snowflake -->
  <g stroke="#0879d5" stroke-width="14" stroke-linecap="round" fill="none">
    <path d="M118 178v116M68 207l100 58M68 265l100-58"/>
    <path d="M118 178l-22-22M118 178l22-22M118 294l-22 22M118 294l22 22"/>
    <path d="M68 207l-30 0M68 207l-10-28M168 265l30 0M168 265l10 28"/>
    <path d="M68 265l-30 0M68 265l10 28M168 207l30 0M168 207l-10-28"/>
  </g>
  <!-- wrench -->
  <path d="M254 105c-18 8-30 26-30 47 0 14 6 27 16 36l-34 94c-5 15 3 31 18 36l8 3c15 5 31-3 36-18l32-95c14-2 27-9 36-21 13-17 15-40 4-59l-26 26-23-7-7-23 25-27c-17-8-38-8-55 0Z" fill="#0b315f"/>
  <!-- airflow -->
  <path d="M298 158c47-29 92-28 132 4-44 2-78 18-103 46 42-13 83-5 112 21-43 7-77 23-103 49" fill="none" stroke="#18bce8" stroke-width="16" stroke-linecap="round"/>
</g>

<!-- divider -->
<path d="M545 48V360" stroke="#0b315f" stroke-width="5"/>

<!-- WORDMARK -->
<g font-family="Arial, Helvetica, sans-serif" fill="#0b315f">
  <text x="590" y="175" font-size="125" font-weight="900" letter-spacing="-5">HVAC</text>
  <text x="595" y="235" font-size="37" font-weight="800" letter-spacing="12">PERFORMANCE</text>
  <text x="595" y="300" font-size="36" font-weight="900" letter-spacing="8" fill="#0879d5">BY W&amp;A</text>
</g>
<path d="M595 325h150M850 325h225" stroke="#18aee0" stroke-width="5" stroke-linecap="round"/>
</svg>